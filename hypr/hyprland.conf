# Monitors 
source = ./monitor.conf
source = ./workspaces.conf

# Programs and Aliases
$mainMod = ALT
$mainShf = $mainMod + SHIFT
$CFG = ~/.config
$BIN = $CFG/bin
$CURSOR = plan9cursors
$terminal = alacritty
$fileManager = pcmanfm
$menu = pkill -x rofi || rofi -show drun

# Environment Variables
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,$CURSOR
env = HYPRCURSOR_THEME,$CURSOR
env = NO_AT_BRIDGE,1
env = QT_PLATFORMTHEME,gtk3
env = QT_QPA_PLATFORMTHEME,gtk3
env = QT_PLATFORM_PLUGIN,gtk3

# Autostart
exec-once = $BIN/wal refresh
exec-once = $BIN/bar refresh
exec-once = $BIN/mon launch
exec-once = $BIN/watcher/wtchr
exec-once = systemctl --user import-environment WAYLAND_DISPLAY
exec-once = systemctl --user start gnome-keyring-daemon
exec-once = /usr/lib/mate-polkit/polkit-mate-authentication-agent-1
exec-once = cclipd -s 2 -t "image/png" -t "image/*" -t "text/plain;charset=utf-8" -t "text/*" -t "*"
exec-once = gsettings set org.gnome.desktop.interface gtk-theme "paradise"
exec-once = gsettings set org.gnome.desktop.wm.preferences theme "paradise"
exec-once = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"

# Styles
animations:enabled = no, fuckoff >:(
cursor:inactive_timeout = 2
decoration {
	rounding = 3
	rounding_power = 3
	dim_inactive = true
	dim_strength = 0.4
    shadow:enabled = false
    blur:enabled = false
}

general {
    gaps_in = 1
    gaps_out = 2
    border_size = 0
	col.inactive_border = rgb(555555)
	col.active_border = rgb(999999)
    allow_tearing = false
    layout = master
}

master {
	new_status = slave
	new_on_active = after
	mfact = 0.5
}

misc {
	font_family = monospace
	force_default_wallpaper = 0
	disable_hyprland_logo = true
	disable_splash_rendering = true
	background_color = rgb(424242)
	key_press_enables_dpms = true
	layers_hog_keyboard_focus = false
}

# Input
input {
	force_no_accel = 1
	accel_profile = flat
	kb_options = ctrl:nocaps
	follow_mouse = 1
	sensitivity = 0
	touchpad {
		natural_scroll = true
	}
}
gesture = 3, horizontal, workspace

# Keybindings
bind = $mainMod, Q, exec, $BIN/kc
bind = $mainMod, T, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainShf, T, exec, [float on] $terminal
bind = $mainShf, E, exec, [float on] $fileManager
bind = $mainMod, W, togglefloating
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, V, exec, $BIN/clip
bind = $mainShf, W, exec, $BIN/wal menu
bind = $mainShf, C, exec, hyprpicker -a
bind = $mainMod, O, exec, $BIN/vol switch
bind = $mainShf, O, exec, $BIN/mon menu
bind = $mainShf, R, exec, $BIN/bar refresh
bind = $mainMod, P, exec, $BIN/shot screen
bind = $mainShf, P, exec, $BIN/shot window
bind = $mainMod, SLASH, exec, $BIN/emoji
bind = $mainShf, DELETE, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, BACKSPACE, exec, $BIN/power

# bind = , ESCAPE, exec, $BIN/esc/escape
# bind = $mainMod, F, fullscreen, 2
bind = $mainMod, F, exec, hyprctl dispatch sendshortcut , F11, 
bind = $mainShf, F, fullscreenstate, 0 2
bind = $mainMod, TAB, exec, $CFG/hypr/focus switch
bind = $mainMod, J, exec, $CFG/hypr/focus cyclenext
bind = $mainMod, K, exec, $CFG/hypr/focus cycleprev
bind = $mainShf, J, layoutmsg, swapnext
bind = $mainShf, K, layoutmsg, swapprev
bindel = $mainMod, H, layoutmsg, mfact -0.01
bindel = $mainMod, L, layoutmsg, mfact +0.01
bindel = $mainMod, H, layoutmsg, colresize -0.01
bindel = $mainMod, L, layoutmsg, colresize +0.02
bind = $mainMod, RETURN, layoutmsg, focusmaster previous
bind = $mainShf, RETURN, layoutmsg, swapwithmaster child ignoremaster

bind = $mainMod, 1, exec, $CFG/hypr/scripts/ws 1
bind = $mainMod, 2, exec, $CFG/hypr/scripts/ws 2
bind = $mainMod, 3, exec, $CFG/hypr/scripts/ws 3
bind = $mainMod, 4, exec, $CFG/hypr/scripts/ws 4
bind = $mainMod, 5, exec, $CFG/hypr/scripts/ws 5
bind = $mainMod, 6, exec, $CFG/hypr/scripts/ws 6
bind = $mainMod, 7, exec, $CFG/hypr/scripts/ws 7
bind = $mainMod, 8, exec, $CFG/hypr/scripts/ws 8
bind = $mainMod, 9, exec, $CFG/hypr/scripts/ws 9
bind = $mainMod, 0, exec, $CFG/hypr/scripts/ws 10

bind = $mainShf, 1, exec, $CFG/hypr/scripts/ws 1 m
bind = $mainShf, 2, exec, $CFG/hypr/scripts/ws 2 m
bind = $mainShf, 3, exec, $CFG/hypr/scripts/ws 3 m
bind = $mainShf, 4, exec, $CFG/hypr/scripts/ws 4 m
bind = $mainShf, 5, exec, $CFG/hypr/scripts/ws 5 m
bind = $mainShf, 6, exec, $CFG/hypr/scripts/ws 6 m
bind = $mainShf, 7, exec, $CFG/hypr/scripts/ws 7 m
bind = $mainShf, 8, exec, $CFG/hypr/scripts/ws 8 m
bind = $mainShf, 9, exec, $CFG/hypr/scripts/ws 9 m
bind = $mainShf, 0, exec, $CFG/hypr/scripts/ws 10 m

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod, M, exec, $BIN/vol mute
bindel = $mainMod, PERIOD, exec, $BIN/vol up
bindel = $mainMod, COMMA, exec, $BIN/vol down
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Windows and Workspaces
windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

windowrule = match:class floaterminal, float on
windowrule = match:class imv, float on
windowrule = match:class org.pulseaudio.pavucontrol, float on
windowrule = match:class org.gnome.FileRoller, float on
windowrule = match:class engrampa, float on
windowrule = match:class xarchiver, float on
windowrule = match:class nwg-look, float on
windowrule = match:class (chrome-)(.*)(-Default), float on
windowrule = match:class org.gnome.gThumb, float on
windowrule = match:title (Save File), float on
windowrule = match:title (.*)(Properties), float on
windowrule = match:fullscreen_state_client 2, fullscreen on
windowrule = match:fullscreen_state_internal 2, fullscreen on
