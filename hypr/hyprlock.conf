input-field {
    monitor =
    size = 295, 65
    outline_thickness = 0
    dots_size = 0.3 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, -1.0 - 1.0
    dots_center = false
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding
    dots_text_format = * # Text character used for the input indicator. Leave empty for a rectangle that will be rounded via dots_rounding (default).
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(255, 255, 255, 0)
    font_color = rgb(4c566a)
    font_family = $font1 # Font used for placeholder_text, fail_text and dots_text_format.
    fade_on_empty = true
    fade_timeout = 1000 # Milliseconds before fade_on_empty is triggered.
    placeholder_text = ""  # Text rendered in the input box when it's empty.
    hide_input = false
    rounding = 0 # -1 means complete rounding (circle/oval)
    check_color = rgb(ffb3ba)
    fail_color = rgb(ffb3ba)
    fail_text = wrong input ($ATTEMPTS) # can be set to empty
    fail_timeout = 1000 # milliseconds before fail_text and fail_color disappears
    capslock_color = rgb(66b2b2)

    position = 32, -45
    halign = center
    valign = center
}
