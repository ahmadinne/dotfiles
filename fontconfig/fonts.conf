<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
	<!-- Default Sans-serif -->
	<alias>
		<family>sans-serif</family>
		<prefer>
			<family>SF Pro Display</family>
			<family>Migu 1M</family>
		</prefer>
	</alias>

	<!-- Default Serif -->
	<alias>
		<family>serif</family>
		<prefer>
			<family>New York</family>
			<family>Migu 1M</family>
		</prefer>
	</alias>

	<!-- Default Monospace -->
	<alias>
		<family>monospace</family>
		<prefer>
			<family>PragmataPro</family>
			<family>Migu 1M</family>
			<family>Symbols Nerd Font Mono</family>
		</prefer>
	</alias>

